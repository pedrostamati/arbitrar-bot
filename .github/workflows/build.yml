name: Build ArbitrAR APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ArbitrAR-android/gradlew

      - name: Build debug APK
        working-directory: ArbitrAR-android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArbitrAR-debug
          path: ArbitrAR-android/app/build/outputs/apk/debug/app-debug.apk
